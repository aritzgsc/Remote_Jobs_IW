{% extends "App_Remote_Jobs/base.html" %}
{% load i18n %}
{% block title %}
    Cerrar sesión · Remote Jobs
{% endblock %}
{% block content %}
    <section class="account-page">
        <div class="container account-card account-message-card">
            <p class="eyebrow">
                HASTA PRONTO
            </p>
            <h1>
                {% trans "Sign Out" %}
            </h1>
            <p>
                ¿Seguro que quieres cerrar sesión en Remote Jobs?
            </p>
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button class="button button-dark" type="submit">
                    Cerrar sesión
                </button>
                <a class="button button-outline" href="{% url 'jobs:inicio' %}">Seguir explorando</a>
            </form>
        </div>
    </section>
{% endblock %}
